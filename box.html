<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'unsafe-inline'" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        user-select: none;
        color: #fff;
        font: 12px 'Microsoft JhengHei UI', 'Segoe UI', sans-serif;
        text-shadow: 0 1px 2px #0009;
      }
      body {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.12); /* tint over the blur from native.blurBehind */
      }
      header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      }
      .bar {
        -webkit-app-region: drag;
        height: 28px; /* + 2px body border = HEADER in main.js */
        padding: 0 4px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
      }
      .bar .right {
        justify-self: end;
      }
      .bar .left,
      .bar .right {
        display: flex;
        gap: 2px;
      }
      #title,
      .bar button,
      nav {
        -webkit-app-region: no-drag; /* so clicks reach the page */
      }
      #title {
        padding: 0 6px;
        outline: none;
      }
      .bar button {
        width: 22px;
        height: 22px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 4px;
        background: none;
        color: #fff;
        opacity: 0.85;
        cursor: pointer;
      }
      .bar button:hover {
        opacity: 1;
        background: rgba(255, 255, 255, 0.2);
      }
      .bar svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 1px 1px #0008);
      }
      nav {
        display: flex;
        flex-wrap: wrap; /* a narrow box shows every tab on two lines instead of hiding some */
        justify-content: center;
        gap: 4px 14px;
        padding: 0 8px 6px;
      }
      nav[hidden] {
        display: none;
      }
      .tab {
        padding-bottom: 2px;
        opacity: 0.7;
        border-bottom: 2px solid transparent;
        outline: none;
      }
      .tab.active {
        opacity: 1;
        border-bottom-color: #fff;
      }
      .tab.drop-target {
        opacity: 1;
        border-radius: 3px;
        animation: drop-pulse 0.45s ease-in-out infinite alternate;
      }
      .tab.dropped {
        border-radius: 3px;
        animation: drop-flash 0.22s ease-out 3;
      }
      @keyframes drop-pulse {
        from {
          background: rgba(255, 255, 255, 0.1);
          box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
        }
        to {
          background: rgba(255, 255, 255, 0.45);
          box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.45);
        }
      }
      @keyframes drop-flash {
        from {
          background: rgba(255, 255, 255, 0.7);
          box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.7);
        }
        to {
          background: transparent;
          box-shadow: 0 0 0 4px transparent;
        }
      }
      main {
        flex: 1;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, 76px);
        grid-auto-rows: 84px;
        gap: 4px;
        padding: 8px;
        align-content: start;
      }
      body.collapsed header {
        border-bottom: 0;
      }
      body.collapsed nav,
      body.collapsed main {
        display: none;
      }
      .item {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 4px;
        border-radius: 4px;
      }
      .item {
        position: relative; /* anchors the drop-position line */
      }
      .item.drop-before::before,
      .item.drop-after::after {
        content: '';
        position: absolute;
        top: 6px;
        bottom: 6px;
        width: 2px;
        border-radius: 1px;
        background: #fff;
        box-shadow: 0 0 3px #000a;
      }
      .item.drop-before::before {
        left: -3px; /* in the middle of the 4px grid gap */
      }
      .item.drop-after::after {
        right: -3px;
      }
      body.list .item.drop-before::before,
      body.list .item.drop-after::after {
        left: 6px;
        right: 6px;
        width: auto;
        height: 2px;
      }
      body.list .item.drop-before::before {
        top: -2px;
        bottom: auto;
      }
      body.list .item.drop-after::after {
        top: auto;
        bottom: -2px;
      }
      .item:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .item.selected {
        background: rgba(59, 130, 246, 0.35);
        box-shadow: inset 0 0 0 1px rgba(147, 197, 253, 0.9);
      }
      .marquee {
        position: fixed;
        pointer-events: none;
        border: 1px solid #3b82f6;
        background: rgba(59, 130, 246, 0.25);
      }
      .item img {
        width: 40px;
        height: 40px;
      }
      .item span {
        margin-top: 4px;
        max-width: 100%;
        text-align: center;
        overflow-wrap: anywhere; /* wrap at spaces; split a word only if it can't fit */
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-thumb {
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.4);
      }
      body.list main {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      body.list .item {
        flex-direction: row;
        padding: 3px 6px;
      }
      body.list .item img {
        width: 20px;
        height: 20px;
      }
      body.list .item span {
        margin: 0 0 0 8px;
        text-align: left;
        -webkit-line-clamp: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="bar">
        <div class="left"><button id="fold"></button><button id="view"></button></div>
        <span id="title"></span>
        <div class="right"><button id="lock"></button><button id="menu" title="選單"></button></div>
      </div>
      <nav id="tabs" hidden></nav>
    </header>
    <main id="items"></main>
    <script src="renderer.js"></script>
  </body>
</html>
